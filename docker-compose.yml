name: hl7-lab

services:
  simhospital:
    image: simhospital:latest      # built locally; no registry copy exists
    pull_policy: never
    command:
      - health/simulator
      - -output=mllp
      - -mllp_destination=host.docker.internal:2575
      - -pathways_per_hour=${PATHWAYS_PER_HOUR:-60}
    ports:
      - "8000:8000"                # dashboard
    restart: unless-stopped        # retries until your local listener is up

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - ./servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"                # AMQP -> local listener/worker connect here
      - "5300:5300"                # admin client
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}"
      ACCEPT_EULA: "Y"
    depends_on:
      mssql:
        condition: service_started
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}"
    restart: unless-stopped