# This is a uv workspace root: the listener and worker are split into
# separately installable distributions (packages/listener, packages/worker)
# sharing packages/core, so each can be containerised without the union of
# both services' dependencies.
#
# uv.lock is the only place exact versions live, at the workspace root; `uv
# sync` / `uv run` build ./.venv from it. Move the lock deliberately -- `uv
# add`, `uv lock --upgrade-package NAME`, or scripts/update-deps.sh -- and
# commit it; the `lock_currency` gate (`uv lock --check`) fails on a lock
# that no longer matches a member's pyproject.toml.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "nox",
  "pytest",
  "pytest-xdist",
  "ruff",
  "shellcheck-py",
  "typer",
]

# Pinned so `nox -t fix` behaves the same on every machine: ruff otherwise
# takes its line length from whichever config it finds walking up from the
# file, and the shipped tests/ are formatted at this width.
[tool.ruff]
line-length = 88
target-version = "py314"
# src glob points ruff at the workspace members' source dirs post-hl7-poc-ouc
# split, so it classifies hl7poc.* as first-party (default src = ['.', 'src']
# no longer contains it) and detect-same-package stays meaningful.
src = ["packages/*/src"]
